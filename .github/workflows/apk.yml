name: APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK lisanslarini kabul et
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Proje klasorunu bul ve derle
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "HATA: settings.gradle bulunamadi. Dosyalar depoya yanlis yuklenmis."
            ls -R | head -60
            exit 1
          fi
          cd "$(dirname "$S")"
          echo "Proje klasoru: $(pwd)"
          ls
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AtolyeDefteri-apk
          path: '**/app-debug.apk'
